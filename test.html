<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10K Zone 2 (MyRunLog Pro)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <!-- 1. Load Firebase Modules (Modern ESM) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Expose SDK to global window
        window.FireSDK = {
            initializeApp,
            getAuth, signInAnonymously, onAuthStateChanged,
            getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, where
        };
    </script>

    <!-- 2. Main Application Logic -->
    <script type="text/babel">
        // --- System Waiter ---
        const waitForFirebase = (callback) => {
            if (window.FireSDK) {
                callback();
            } else {
                setTimeout(() => waitForFirebase(callback), 100);
            }
        };

        waitForFirebase(() => {
            const { useState, useEffect } = React;
            const { 
                initializeApp, 
                getAuth, signInAnonymously, onAuthStateChanged,
                getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot 
            } = window.FireSDK;

            // --- USER CONFIGURATION (Embedded) ---
            const firebaseConfig = {
                apiKey: "AIzaSyAJbctH1cdKJg-nwbUindJKrANuden2lsc",
                authDomain: "myrunlog-6c62c.firebaseapp.com",
                projectId: "myrunlog-6c62c",
                storageBucket: "myrunlog-6c62c.firebasestorage.app",
                messagingSenderId: "225317864720",
                appId: "1:225317864720:web:fd63b92b0b489c62349195",
                measurementId: "G-SK8RSS6745"
            };

            // --- Icons ---
            const Icon = ({ children, className }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {children}
                </svg>
            );
            const Activity = ({ className }) => (<Icon className={className}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></Icon>);
            const Save = ({ className }) => (<Icon className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></Icon>);
            const CalendarIcon = ({ className }) => (<Icon className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></Icon>);
            const Trash2 = ({ className }) => (<Icon className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></Icon>);
            const Cloud = ({ className }) => (<Icon className={className}><path d="M17.5 19c0-1.7-1.3-3-3-3h-1.1c-.1-1.3-.8-2.5-1.9-3.2-1.1-.8-2.5-.9-3.7-.4-1.2.6-2.1 1.7-2.3 3H5c-1.7 0-3 1.3-3 3s1.3 3 3 3h12.5c1.7 0 3-1.3 3-3z"/></Icon>);
            const CloudOff = ({ className }) => (<Icon className={className}><path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"/><line x1="1" y1="1" x2="23" y2="23"/></Icon>);
            const TrendingUp = ({ className }) => (<Icon className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Icon>);
            const AlertTriangle = ({ className }) => (<Icon className={className}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></Icon>);
            const Plus = ({ className }) => (<Icon className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>);

            // --- Main Component ---
            const RunPlanLogger = () => {
                const [logs, setLogs] = useState([]);
                const [user, setUser] = useState(null);
                const [runnerId, setRunnerId] = useState(() => localStorage.getItem('my_runner_id') || '');
                const [isSyncing, setIsSyncing] = useState(false);
                const [appStatus, setAppStatus] = useState('connecting');
                const [authErrorMessage, setAuthErrorMessage] = useState(null);

                // App Variables
                const [dbRef, setDbRef] = useState(null);
                const [authRef, setAuthRef] = useState(null);
                const appId = firebaseConfig.projectId;

                // Form State
                const [formData, setFormData] = useState({
                    date: new Date().toISOString().split('T')[0],
                    totalDistance: 5, // Default distance
                    hrSplits: {}, // Object to store HR for each KM { 1: 135, 2: 140 ... }
                    note: ''
                });

                // 1. Initialize System
                useEffect(() => {
                    const initSystem = async () => {
                        try {
                            const app = initializeApp(firebaseConfig);
                            const auth = getAuth(app);
                            const db = getFirestore(app);
                            
                            setAuthRef(auth);
                            setDbRef(db);

                            try {
                                await signInAnonymously(auth);
                            } catch (authErr) {
                                console.error("Auth Error:", authErr);
                                setAppStatus('offline');
                                if (authErr.code === 'auth/configuration-not-found' || authErr.code === 'auth/operation-not-allowed') {
                                    setAuthErrorMessage('ยังไม่ได้เปิดใช้งาน "Anonymous Auth" ใน Firebase Console');
                                } else {
                                    setAuthErrorMessage(authErr.message);
                                }
                                return;
                            }

                            onAuthStateChanged(auth, (u) => {
                                setUser(u);
                                if(u) setAppStatus('online');
                            });

                        } catch (err) {
                            console.error("Firebase Init Failed", err);
                            setAppStatus('offline');
                            setAuthErrorMessage("ตั้งค่าไม่ถูกต้อง: " + err.message);
                        }
                    };

                    initSystem();
                }, []);

                // 2. Data Sync
                useEffect(() => {
                    if (appStatus === 'online' && user && runnerId && dbRef) {
                        setIsSyncing(true);
                        const logsRef = collection(dbRef, 'artifacts', appId, 'public', 'data', 'run_logs_v1');
                        
                        const unsubscribe = onSnapshot(logsRef, (snapshot) => {
                            const loadedLogs = snapshot.docs
                                .map(doc => ({ id: doc.id, ...doc.data() }))
                                .filter(doc => doc.runnerId === runnerId)
                                .sort((a, b) => new Date(b.date) - new Date(a.date) || b.createdAt - a.createdAt);
                            setLogs(loadedLogs);
                            setIsSyncing(false);
                        }, (err) => {
                            console.error("Snapshot error:", err);
                            setIsSyncing(false);
                        });
                        return () => unsubscribe();
                    } else if (appStatus !== 'connecting') {
                        const saved = localStorage.getItem(`runLogs_${runnerId || 'local'}`);
                        if (saved) setLogs(JSON.parse(saved));
                    }
                }, [appStatus, user, runnerId, dbRef]);

                // Actions
                const handleRunnerIdChange = (e) => {
                    setRunnerId(e.target.value);
                    localStorage.setItem('my_runner_id', e.target.value);
                };

                const handleHrChange = (kmIndex, value) => {
                    setFormData(prev => ({
                        ...prev,
                        hrSplits: {
                            ...prev.hrSplits,
                            [kmIndex]: value
                        }
                    }));
                };

                const handleDistanceChange = (e) => {
                    const dist = parseInt(e.target.value) || 0;
                    setFormData(prev => ({ ...prev, totalDistance: dist }));
                };

                const handleSubmit = async (e) => {
                    e.preventDefault();
                    
                    // Construct log object including detailed splits
                    const newLog = {
                        runnerId: runnerId || 'local',
                        date: formData.date,
                        totalDistance: formData.totalDistance,
                        hrSplits: formData.hrSplits, // Store detailed splits map
                        // Also store legacy fields for backward compatibility/quick view if needed, 
                        // though we will display dynamically now.
                        km1: parseInt(formData.hrSplits[1]) || 0,
                        km2: parseInt(formData.hrSplits[2]) || 0,
                        km3: parseInt(formData.hrSplits[3]) || 0,
                        // Calculate avg for the rest just in case
                        note: formData.note,
                        createdAt: Date.now()
                    };

                    if (appStatus === 'online' && user && dbRef) {
                        try {
                            await addDoc(collection(dbRef, 'artifacts', appId, 'public', 'data', 'run_logs_v1'), newLog);
                        } catch (err) { 
                            alert("บันทึก Cloud ไม่สำเร็จ (จะบันทึกในเครื่องแทน): " + err.message);
                            const updatedLogs = [ { ...newLog, id: Date.now() }, ...logs ];
                            setLogs(updatedLogs);
                            localStorage.setItem(`runLogs_${runnerId || 'local'}`, JSON.stringify(updatedLogs));
                        }
                    } else {
                        const updatedLogs = [ { ...newLog, id: Date.now() }, ...logs ];
                        setLogs(updatedLogs);
                        localStorage.setItem(`runLogs_${runnerId || 'local'}`, JSON.stringify(updatedLogs));
                    }
                    
                    // Reset form but keep distance preference
                    setFormData(prev => ({
                        date: new Date().toISOString().split('T')[0],
                        totalDistance: prev.totalDistance,
                        hrSplits: {},
                        note: ''
                    }));
                };

                const handleDelete = async (id) => {
                    if(!confirm('ลบรายการนี้?')) return;
                    if (appStatus === 'online' && user && dbRef) {
                        try {
                            await deleteDoc(doc(dbRef, 'artifacts', appId, 'public', 'data', 'run_logs_v1', id));
                        } catch (err) { alert("ลบไม่สำเร็จ"); }
                    } else {
                        const updatedLogs = logs.filter(l => l.id !== id);
                        setLogs(updatedLogs);
                        localStorage.setItem(`runLogs_${runnerId || 'local'}`, JSON.stringify(updatedLogs));
                    }
                };

                const getStatusColor = (hr, kmIndex) => {
                    if (!hr) return 'bg-gray-100 text-gray-400';
                    // Strict Zone 2 for first 3 km
                    if (kmIndex <= 3) {
                        if (hr <= 133) return 'bg-emerald-100 text-emerald-700 font-bold border-emerald-200'; 
                        if (hr <= 140) return 'bg-yellow-100 text-yellow-700 border-yellow-200'; 
                        return 'bg-red-100 text-red-700 border-red-200 font-bold'; 
                    } else {
                        if (hr <= 140) return 'bg-emerald-100 text-emerald-700 border-emerald-200';
                        if (hr <= 153) return 'bg-blue-100 text-blue-700 border-blue-200'; 
                        return 'bg-orange-100 text-orange-700 border-orange-200';
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-50 p-4 md:p-8 pb-20">
                        <div className="max-w-4xl mx-auto space-y-8">
                            
                            {/* Header */}
                            <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                                <div className="text-center md:text-left">
                                    <h1 className="text-3xl font-extrabold text-slate-900 flex items-center gap-2 justify-center md:justify-start">
                                        <Activity className="w-8 h-8 text-emerald-500" />
                                        10K Zone 2 <span className="text-emerald-600">Pro</span>
                                    </h1>
                                    <p className="text-sm text-slate-500">บันทึกละเอียดทุกกิโลเมตร</p>
                                </div>

                                <div className="flex items-center gap-2">
                                    <div className={`px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 ${appStatus === 'online' ? 'bg-emerald-100 text-emerald-700' : 'bg-orange-100 text-orange-600'}`}>
                                        {appStatus === 'online' ? <Cloud className="w-3 h-3"/> : <CloudOff className="w-3 h-3"/>}
                                        {appStatus === 'online' ? 'Online' : (appStatus === 'connecting' ? 'Connecting...' : 'Offline Mode')}
                                    </div>
                                </div>
                            </div>

                            {/* Runner ID Input */}
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row items-center gap-4 justify-between">
                                <div className="flex items-center gap-2 text-slate-700">
                                    <div className="bg-slate-100 p-2 rounded-full"><Activity className="w-5 h-5"/></div>
                                    <span className="font-bold">Runner ID:</span>
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="ใส่ชื่อของคุณ (เช่น TonyStark)" 
                                    value={runnerId}
                                    onChange={handleRunnerIdChange}
                                    className="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold text-slate-800 outline-none focus:ring-2 ring-emerald-500"
                                />
                            </div>

                            {/* Input Form */}
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                                <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2">
                                    <TrendingUp className="w-5 h-5 text-indigo-500"/> บันทึกผลวันนี้
                                </h3>
                                <form onSubmit={handleSubmit} className="space-y-6">
                                    
                                    {/* Top Row: Date & Total Distance */}
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-semibold text-slate-500">วันที่</label>
                                            <input type="date" required name="date" value={formData.date} onChange={(e) => setFormData({...formData, date: e.target.value})} className="w-full p-2 rounded-lg border focus:ring-2 ring-emerald-500 outline-none"/>
                                        </div>
                                        <div>
                                            <label className="text-xs font-semibold text-slate-500">ระยะทางรวม (Km)</label>
                                            <select 
                                                value={formData.totalDistance} 
                                                onChange={handleDistanceChange}
                                                className="w-full p-2 rounded-lg border focus:ring-2 ring-emerald-500 outline-none bg-white"
                                            >
                                                {[...Array(21).keys()].map(i => i + 1).filter(n => n >= 3).map(num => (
                                                    <option key={num} value={num}>{num} km</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    {/* Dynamic HR Inputs */}
                                    <div>
                                        <label className="text-xs font-semibold text-slate-500 mb-2 block">HR รายกิโลเมตร (BPM)</label>
                                        <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-3">
                                            {[...Array(formData.totalDistance).keys()].map(i => {
                                                const kmNum = i + 1;
                                                const isEarly = kmNum <= 3;
                                                return (
                                                    <div key={kmNum} className="relative">
                                                        <label className={`text-[10px] uppercase font-bold absolute -top-2 left-2 px-1 bg-white ${isEarly ? 'text-emerald-600' : 'text-slate-400'}`}>
                                                            Km {kmNum}
                                                        </label>
                                                        <input 
                                                            type="number" 
                                                            placeholder="HR" 
                                                            value={formData.hrSplits[kmNum] || ''}
                                                            onChange={(e) => handleHrChange(kmNum, e.target.value)}
                                                            className={`w-full p-2 pt-3 text-center rounded-lg border outline-none focus:ring-2 ${isEarly ? 'border-emerald-200 focus:ring-emerald-500' : 'border-slate-200 focus:ring-blue-500'}`}
                                                        />
                                                        {isEarly && <div className="text-[9px] text-center text-emerald-500 mt-0.5">&lt; 133</div>}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div>
                                        <input type="text" name="note" placeholder="โน้ตเพิ่มเติม (เช่น ร้อนมาก, ขาล้า)" value={formData.note} onChange={(e) => setFormData({...formData, note: e.target.value})} className="w-full p-2 rounded-lg border focus:ring-2 ring-emerald-500 outline-none"/>
                                    </div>
                                    
                                    <button type="submit" disabled={!runnerId} className="w-full bg-slate-900 hover:bg-slate-800 disabled:bg-slate-300 text-white font-bold py-3 rounded-xl transition-all shadow-lg flex justify-center gap-2">
                                        <Save className="w-5 h-5" /> บันทึก {appStatus === 'online' ? '(Cloud)' : '(Local)'}
                                    </button>
                                </form>
                            </div>

                            {/* Log Table */}
                            <div className="space-y-4">
                                <h3 className="font-bold text-slate-700 flex items-center gap-2 px-1">
                                    <CalendarIcon className="w-5 h-5 text-slate-500"/> 
                                    ประวัติการวิ่ง: {runnerId || '...'}
                                </h3>

                                {logs.length === 0 ? (
                                    <div className="text-center p-8 text-slate-400 bg-white rounded-xl border border-slate-200 border-dashed">
                                        ยังไม่มีข้อมูล เริ่มบันทึกวิ่งครั้งแรกเลย!
                                    </div>
                                ) : (
                                    logs.map(log => (
                                        <div key={log.id} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                            <div className="bg-slate-50 p-3 border-b border-slate-100 flex justify-between items-center">
                                                <div className="flex items-center gap-3">
                                                    <span className="font-bold text-slate-700 text-lg">
                                                        {new Date(log.date).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' })}
                                                    </span>
                                                    <span className="text-xs bg-slate-200 text-slate-600 px-2 py-1 rounded-full font-bold">
                                                        {log.totalDistance || '?'} km
                                                    </span>
                                                </div>
                                                <button onClick={() => handleDelete(log.id)} className="text-slate-300 hover:text-red-500"><Trash2 className="w-4 h-4" /></button>
                                            </div>
                                            
                                            {/* Splits Grid */}
                                            <div className="p-4">
                                                <div className="flex flex-wrap gap-2 mb-3">
                                                    {/* Handle both old format (km1, km2 fields) and new format (hrSplits object) */}
                                                    {log.hrSplits ? (
                                                        // New Format
                                                        Object.keys(log.hrSplits).sort((a,b) => parseInt(a)-parseInt(b)).map(km => (
                                                            <div key={km} className={`flex flex-col items-center p-2 rounded-lg border min-w-[50px] ${getStatusColor(log.hrSplits[km], parseInt(km))}`}>
                                                                <span className="text-[9px] uppercase opacity-70 mb-1">Km {km}</span>
                                                                <span className="font-bold text-sm">{log.hrSplits[km]}</span>
                                                            </div>
                                                        ))
                                                    ) : (
                                                        // Fallback for old data
                                                        <>
                                                            {log.km1 && <div className={`flex flex-col items-center p-2 rounded-lg border min-w-[50px] ${getStatusColor(log.km1, 1)}`}><span className="text-[9px] uppercase opacity-70 mb-1">Km 1</span><span className="font-bold text-sm">{log.km1}</span></div>}
                                                            {log.km2 && <div className={`flex flex-col items-center p-2 rounded-lg border min-w-[50px] ${getStatusColor(log.km2, 2)}`}><span className="text-[9px] uppercase opacity-70 mb-1">Km 2</span><span className="font-bold text-sm">{log.km2}</span></div>}
                                                            {log.km3 && <div className={`flex flex-col items-center p-2 rounded-lg border min-w-[50px] ${getStatusColor(log.km3, 3)}`}><span className="text-[9px] uppercase opacity-70 mb-1">Km 3</span><span className="font-bold text-sm">{log.km3}</span></div>}
                                                        </>
                                                    )}
                                                </div>
                                                {log.note && <p className="text-sm text-slate-500 italic mt-2 border-t border-slate-100 pt-2">"{log.note}"</p>}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<RunPlanLogger />);
        });
    </script>
</body>
</html>
